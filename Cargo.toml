[package]
name = "rekord"
version = "0.1.0"
edition = "2024"
description = "Listen to a microphone live with voice enhancement, and record it without ever losing a take."
publish = false

[dependencies]
anstream = "1"
anstyle = "1"
anyhow = "1.0"
audioadapter-buffers = "5.2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.6", features = ["derive"] }
cpal = "0.18"
deep_filter = { git = "https://github.com/Rikorose/DeepFilterNet", tag = "v0.5.6", version = "0.5.6", default-features = false, features = ["tract", "default-model"] }
dirs = "7"
ndarray = "0.15"
ratatui = "0.30"
rtrb = "0.4"
rubato = "5"
serde = { version = "1", features = ["derive"] }
toml = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
] }

[dev-dependencies]
tempfile = "3"

# The neural denoiser is far too slow without optimizations; keep dependencies
# optimized even in debug builds so `cargo run` works in real time.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
